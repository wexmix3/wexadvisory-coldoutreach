name: Maps Scraper Fallback

# Fires only when auto-discover's Google Places call hits quota/billing exhaustion
# (see lib/maps-scraper-fallback.ts). Not a cron -- purely event-driven, so it costs
# nothing when Places is healthy. gosom/google-maps-scraper stands in for Places for
# one city/category, self-hosted on the runner (no external service, no proxies).
on:
  repository_dispatch:
    types: [maps-scraper-fallback]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build query
        run: |
          mkdir -p out
          echo "${{ github.event.client_payload.category }} in ${{ github.event.client_payload.city }}" > queries.txt

      - name: Run scraper
        run: |
          # latest (Playwright-based) has a live upstream bug as of 2026-07-19 --
          # "could not install driver: driver exists but version not 1.60.0" --
          # matches open issues gosom/google-maps-scraper#187, #291, #302, #309.
          # latest-rod uses the Rod browser-automation lib instead, sidestepping
          # that driver-install path -- but has its own bug: after logging
          # "exiting because of inactivity" it can hang indefinitely on shutdown
          # instead of exiting. `timeout` bounds that so the job doesn't just
          # burn the full 8-minute job budget waiting on a hung container --
          # SIGTERM at 4m, SIGKILL 30s later if it's still not dead. `|| true`
          # so a killed/non-zero scraper doesn't skip the upsert step below --
          # if results.json was flushed before the hang, still use it.
          timeout -k 30 4m docker run --rm \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/out:/out" \
            gosom/google-maps-scraper:latest-rod \
            -input /queries.txt \
            -json \
            -results /out/results.json \
            -depth 1 \
            -email \
            -exit-on-inactivity 90s || true

      - name: Upsert results to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FALLBACK_CITY: ${{ github.event.client_payload.city }}
          FALLBACK_CATEGORY: ${{ github.event.client_payload.category }}
        run: node scripts/maps-scraper-upsert.mjs
